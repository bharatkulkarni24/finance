<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sri Lakshmi Venkateshwara Finance</title>
    <meta name="theme-color" content="#081124" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/img/favicon.ico" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="/static/css/styles.css?v=74" />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="topbar login-mode" id="topbar">
        <div class="hero"></div>

        <div class="login-header">
          <div class="side left-side">
            <img src="/static/img/left.png" alt="" class="side-img" />
          </div>
          <div class="login-name">
            <h1>Sri Lakshmi Venkateshwara Finance</h1>
            <div class="kn-heading">ಶ್ರೀ ಲಕ್ಷ್ಮಿ ವೆಂಕಟೇಶ್ವರ ಫೈನಾನ್ಸ್</div>
          </div>
          <div class="side right-side">
            <img src="/static/img/right.png" alt="" class="side-img" />
          </div>
        </div>

        <div class="logo">
          <div class="side left-side">
            <img src="/static/img/left.png" alt="" class="side-img logo-side" />
          </div>
          <div class="logo-text">
            <h1>Sri Lakshmi Venkateshwara Finance</h1>
            <div class="kn-heading">ಶ್ರೀ ಲಕ್ಷ್ಮಿ ವೆಂಕಟೇಶ್ವರ ಫೈನಾನ್ಸ್</div>
          </div>
          <div class="side right-side">
            <img src="/static/img/right.png" alt="" class="side-img logo-side" />
          </div>
        </div>

        <div class="login-fields" id="login-fields">
          <div class="input-row">
            <label for="member-select" data-i18n="Select Member">Select Member</label>
            <select id="member-select">
              {% if members %}
                {% for m in members %}
                  <option value="{{ m.name }}">{{ m.name }}{% if m.is_admin %} (Admin){% endif %}</option>
                {% endfor %}
              {% endif %}
            </select>
          </div>
          <div class="input-row">
            <label for="admin-pin" data-i18n="Password">Password</label>
            <div style="position:relative;flex:1">
              <input id="admin-pin" type="password" placeholder="Enter password" />
              <span id="pin-toggle" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#94a3b8;font-size:18px;user-select:none">👁</span>
            </div>
          </div>
          <button id="login-button" class="btn primary" data-i18n="Login">Login</button>
          <div id="login-error" class="hidden" style="color:#fb7185;font-size:0.85rem;text-align:center"></div>
        </div>
      </div>

      <div id="main-screen" class="screen hidden">
        <div class="navbar" id="navbar">
          <button type="button" id="menu-btn" class="menu-btn" aria-label="Menu"><span class="menu-icon"></span></button>
          <div id="navbar-title" class="navbar-title"></div>
          <div id="menu-links"></div>
          <button type="button" id="user-avatar-btn" class="user-avatar" hidden></button>
          <div class="user-menu" id="user-menu"></div>
        </div>
        <div id="content"></div>
      </div>
      <div id="toast-container" aria-live="polite" style="position:fixed;right:18px;bottom:18px;z-index:9999"></div>
    </div>
    <script src="/static/js/app.js?v=89"></script>
  </body>
</html>
