<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sri Lakshmi Venkateshwara Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="topbar login-mode" id="topbar">
        <div class="hero"></div>
        <div class="logo">
          <div class="logo-mark">SLV</div>
          <div class="logo-text">
            <h1>
              Sri Lakshmi Venkateshwara Finance
              <div class="kn-heading">ಶ್ರೀ ಲಕ್ಷ್ಮಿ ವೆಂಕಟೇಶ್ವರ ಫೈನಾನ್ಸ್</div>
            </h1>
          </div>
        </div>
        <div class="login-fields" id="login-fields">
          <div class="input-row">
            <label for="member-select" data-i18n="Select Member">Select Member</label>
            <select id="member-select">
              {% if members %}
                {% for m in members %}
                  <option value="{{ m.name }}">{{ m.name }}{% if m.is_admin %} (Admin){% endif %}</option>
                {% endfor %}
              {% endif %}
            </select>
          </div>
          <div class="input-row">
            <label for="admin-pin" data-i18n="Password / PIN">Password / PIN</label>
            <div style="position:relative;flex:1">
              <input id="admin-pin" type="password" placeholder="Enter password" />
              <span id="pin-toggle" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#94a3b8;font-size:14px;user-select:none">👁</span>
            </div>
          </div>
          <button id="login-button" class="btn primary" data-i18n="Login">Login</button>
          <div id="login-error" class="hidden" style="color:#fb7185;font-size:0.85rem;text-align:center"></div>
        </div>
        <div class="lang-wrap">
          <button id="lang-toggle" class="btn secondary">KN</button>
        </div>
      </div>

      <div id="main-screen" class="screen hidden">
        <div class="navbar" id="menu-links"></div>
        <div id="content"></div>
      </div>
      <div id="toast-container" aria-live="polite" style="position:fixed;right:18px;bottom:18px;z-index:9999"></div>
    </div>
    <script src="/static/js/app.js"></script>
  </body>
</html>
